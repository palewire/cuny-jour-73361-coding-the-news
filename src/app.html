<!--
  app.html - The HTML Shell Template for SvelteKit
  ================================================
  
  This file is the base HTML template that wraps your entire SvelteKit application.
  Think of it as the "outer shell" that contains all your pages. Every page you 
  create in the routes/ folder will be rendered inside this template.
  
  SvelteKit uses special placeholders (like %sveltekit.head% and %sveltekit.body%)
  that get replaced with your actual content when the page is built or served.
  
  This file is loaded ONCE and stays the same across all pages - only the content
  inside %sveltekit.body% changes as you navigate between routes.
-->
<!doctype html>
<html lang="en">
	<head>
		<!--
      The <head> section contains metadata about the page.
      This information doesn't appear visibly on the page, but tells
      browsers and search engines important details about your site.
    -->

		<!-- Character encoding: UTF-8 supports all languages and special characters -->
		<meta charset="utf-8" />

		<!-- Viewport meta tag: Essential for responsive design on mobile devices
         Without this, mobile browsers may display your site zoomed out -->
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Preconnect hints: These tell the browser to establish early connections
         to Google Fonts servers, making font loading faster -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- Favicon: The small icon that appears in browser tabs
         %sveltekit.assets% is replaced with the path to your static folder -->
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />

		<!-- %sveltekit.head% - SvelteKit Placeholder
         This gets replaced with:
         - <title> tags from your pages
         - CSS stylesheets  
         - Meta tags (for SEO, social sharing, etc.)
         - Any other <head> content from your components using <svelte:head> -->
		%sveltekit.head%
	</head>
	<body>
		<!-- %sveltekit.body% - SvelteKit Placeholder
         This is where your actual page content goes!
         
         SvelteKit replaces this with:
         - Your +layout.svelte components (the shared layout)
         - Your +page.svelte components (the page-specific content)
         
         The wrapping <div> is required by SvelteKit for its hydration process
         (connecting server-rendered HTML to client-side JavaScript) -->
		<div>%sveltekit.body%</div>
	</body>
</html>
