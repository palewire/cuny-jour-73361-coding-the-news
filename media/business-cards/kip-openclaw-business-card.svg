<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="600" viewBox="0 0 1050 600" role="img" aria-labelledby="title desc">
  <title id="title">Business card for Kip, OpenClaw Assistant</title>
  <desc id="desc">A dark business card with orange accents for Kip, an OpenClaw assistant.</desc>
  <defs>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#282828"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1050" height="600" rx="28" fill="#f2f0ea"/>
  <rect x="24" y="24" width="1002" height="552" rx="22" fill="url(#surface)" filter="url(#softShadow)"/>

  <path d="M96 102h210" stroke="#f47920" stroke-width="10" stroke-linecap="square"/>
  <path d="M96 126h120" stroke="#f47920" stroke-width="4" stroke-linecap="square" opacity="0.72"/>

  <g transform="translate(744 88)">
    <rect x="0" y="0" width="210" height="210" rx="18" fill="#111111" stroke="#f47920" stroke-width="4"/>
    <path d="M60 62c29-25 65-25 94 0" fill="none" stroke="#f47920" stroke-width="12" stroke-linecap="round"/>
    <path d="M54 104c28-18 75-18 104 0" fill="none" stroke="#f47920" stroke-width="12" stroke-linecap="round"/>
    <path d="M70 148h74" stroke="#f47920" stroke-width="12" stroke-linecap="round"/>
    <circle cx="76" cy="92" r="9" fill="#ffffff"/>
    <circle cx="138" cy="92" r="9" fill="#ffffff"/>
  </g>

  <text x="96" y="238" fill="#ffffff" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="34" letter-spacing="0">openclaw assistant</text>
  <text x="96" y="342" fill="#ffffff" font-family="Arial Black, Impact, sans-serif" font-size="116" letter-spacing="0">Kip</text>
  <text x="102" y="392" fill="#f88025" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="28" letter-spacing="0">autonomous systems aide</text>

  <g fill="#dfdfdf" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="24">
    <text x="100" y="474">checks status / runs diagnostics / keeps context</text>
    <text x="100" y="518">available wherever OpenClaw is installed</text>
  </g>

  <g transform="translate(748 362)" font-family="Menlo, Consolas, 'Courier New', monospace">
    <text x="0" y="0" fill="#ffffff" font-size="26">CALL SIGN</text>
    <text x="0" y="42" fill="#f88025" font-size="34">kip@openclaw</text>
    <text x="0" y="94" fill="#bdbdbd" font-size="20">persistent, local, useful</text>
  </g>

  <path d="M96 558h858" stroke="#f47920" stroke-width="4" stroke-linecap="square" opacity="0.9"/>
</svg>
