# All the copy and structured data for the syllabus homepage

meta:
  title: 'Coding the News | JOUR 73361 | Craig Newmark Graduate School of Journalism'
  description: "Syllabus for JOUR 73361: Coding the News at the City University of New York's Craig Newmark Graduate School of Journalism"
  ogImage: 'https://palewi.re/docs/coding-the-news/social-share.jpg'

modules:
  - number: 1
    title: 'Fundamental Tools'
    id: 'fundamentals'
    intro: 'In the first half of the semester, you will learn the software and skills that news developers use to build interactive, data-driven stories.'
    homework: 'Each week you will be expected to complete assignments that reinforce the skills covered in class. You will be expected to research how professional newsrooms use these tools and present your findings to classmates.'
    background: 'white'
    topics:
      - icon: 'Monitor'
        title: "Today's Tool Belt"
        description: 'Set up Visual Studio Code, connect to GitHub and learn to collaborate with an AI coding assistant.'
      - icon: 'Globe'
        title: 'Static Site Publishing'
        description: 'Explore SvelteKit and the page-building frameworks newsrooms use to publish to the World Wide Web.'
      - icon: 'Blocks'
        title: 'Reusable Components'
        description: 'Use Node.JS and Svelte to craft pages with modular components.'
      - icon: 'Sparkle'
        title: 'Interactive Features'
        description: 'Add interactivity to your pages with reactive variables.'
      - icon: 'BarChart3'
        title: 'Data-Driven Templates'
        description: 'Import datasets and use templating techniques to create tables, charts and other visualizations.'
      - icon: 'Layout'
        title: 'Design Systems'
        description: 'Apply CSS grids, typography hierarchies and responsive techniques to create polished presentations.'

  - number: 2
    title: 'Simple Applications'
    id: 'simple-applications'
    intro: "It's time to build. You will practice your new skills by creating simplified versions of common digital story formats."
    homework: 'Each class begins with a folder of text, images, data and graphics that we will assemble together into a working prototype. After getting familiar with each format, you will be asked to develop and publish a variation on the example.'
    background: 'light-gray'
    gridClass: 'grid-2 grid-narrow'
    topics:
      - icon: 'Database'
        title: 'Database Explorer'
        description: 'A searchable directory with detail pages for individual records'
      - icon: 'ScrollText'
        title: 'Multimedia Slideshow'
        description: 'A photo-driven story page that weaves together images and text'
      - icon: 'Map'
        title: 'Interactive Map'
        description: 'A geographic visualization that lets readers explore data'
      - icon: 'User'
        title: 'Personal Portfolio'
        description: 'A website that showcases your best work'

  - number: 3
    title: 'The Real Deal'
    id: 'real-deal'
    intro: "The final weeks will be dedicated to designing, developing and deploying an application that showcases what you've learned. You will propose an idea or choose from a set of challenges, then bring it to life."
    homework: "The culmination of the semester will be a portfolio-ready piece that demonstrates your ability to design, build and publish interactive journalism. You will present it to your peers on the last day of class. An A grade will demonstrate mastery of the skills we've covered."
    background: 'white'
    topics:
      - icon: 'Lightbulb'
        title: 'Pitch Your Story'
        description: 'Choose a project idea for an interactive data story.'
      - icon: 'Database'
        title: 'Gather Assets'
        description: 'Collect the text, images and data you need to make your story special.'
      - icon: 'ClipboardList'
        title: 'Make a Plan'
        description: "Map out your project's structure with a detailed outline."
      - icon: 'Hammer'
        title: 'Build and Iterate'
        description: 'Implement your outline and refine the presentation through multiple iterations.'
      - icon: 'MessageCircle'
        title: 'Take Feedback'
        description: 'Share your work-in-progress and incorporate constructive criticism.'
      - icon: 'Presentation'
        title: 'Hit the Deadline'
        description: 'Deliver a polished presentation of your project to the class.'

evaluation:
  kicker: 'Grading'
  title: 'Evaluation Criteria'
  intro: 'Your grade will be determined based on three rubrics, one for each module.'
  background: 'light-gray'
  criteria:
    - icon: 'ClipboardCheck'
      title: 'Module 1: Fundamental Tools'
      description: 'Show up, participate and complete your homework'
      href: '/grading/module-1/'
    - icon: 'Star'
      title: 'Module 2: Simple Applications'
      description: 'Demonstrate professional effort and experimentation'
      href: '/grading/module-2/'
    - icon: 'Trophy'
      title: 'Module 3: The Real Deal'
      description: 'Deliver a page that is ready to publish on a real news site'
      href: '/grading/module-3/'

